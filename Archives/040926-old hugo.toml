baseURL = "https://laurence-poussard.com/"
theme = "PaperMod"
defaultContentLanguage = "fr"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
buildDrafts = false
buildFuture = false

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# ══════════════════════════════════════════
# TAXONOMIES
# tag      = maillage fin transversal
# category = les rubriques de la home (IA / Architecture / Reflexion)
# ══════════════════════════════════════════

[taxonomies]
  tag = "tags"
  category = "categories"

# ══════════════════════════════════════════
# PARAMÈTRES GLOBAUX
# ══════════════════════════════════════════

[params]
  author = "Laurence Poussard"
  defaultTheme = "auto"
  mainSections = ["articles"]
  ShowReadingTime = true
  ShowShareButtons = true
  ShareButtons = ["linkedin", "whatsapp"]
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowLanguageSwitcher = true
  comments = true

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/laurence-poussard-76115162/"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:laurence.poussard63@gmail.com"

  [params.giscus]
    repo = "Djeckelle/MonBlog"
    repoID = "R_kgDOSXBQ6g"
    category = "General"
    categoryID = "DIC_kwDOSXBQ6s4C-3zj"
    mapping = "pathname"
    strict = "0"
    reactionsEnabled = "1"
    emitMetadata = "0"
    inputPosition = "top"
    theme = "preferred_color_scheme"
    lang = "fr"

# ══════════════════════════════════════════
# FRANÇAIS (langue par défaut)
# ══════════════════════════════════════════

[languages.fr]
  locale = "fr-FR"
  label = "Français"
  weight = 1
  title = "Laurence Poussard"

  [languages.fr.params]
    description = "Architecture d'entreprise, IA, gouvernance du SI — convictions, manifestes et partage d'expérience."

  [languages.fr.params.homeInfoParams]
    Title = "Laurence Poussard"
    Content = """Architecte d'entreprise. Experte de la <em>Continuous Architecture</em>.<br><br>Ce site est un espace de partage d'expériences et de retours du terrain, pour <strong>insuffler du sens, élever le débat et nourrir l'intelligence collective</strong> autour de nos choix technologiques.<br><br><strong>🚀 Par où commencer ?</strong><br>• <a href="/about/">Qui je suis</a> — mon parcours, mes valeurs et ma vision<br>• <a href="/dossiers/architecture-continue-polycrise-2026.html">Le dossier de fond</a> — <em>l'Architecture Continue face à l'imprévisible</em><br>• <a href="/manifeste/">Le Manifeste</a> — <em>les 6 habitudes d'un SI efficace</em><br>• <a href="/intentions/">Convictions & Dialogues</a> — <em>pourquoi ce partage et comment échanger</em>"""

# ---------- MENU FRANÇAIS ----------

  [[languages.fr.menu.main]]
    identifier = "manifeste"
    name = "Manifeste"
    url = "/manifeste/"
    weight = 10

  [[languages.fr.menu.main]]
    identifier = "reperes"
    name = "Repères"
    url = "/reperes/"
    weight = 20

  [[languages.fr.menu.main]]
